name: Feature request
description: Suggest an improvement or use case. 개선 아이디어나 사용 사례를 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. English and Korean requests are both welcome.
  - type: textarea
    id: use-case
    attributes:
      label: Use case / 사용 사례
      description: What problem are you trying to solve, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 제안
      description: Describe the behavior or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 대안
      description: Describe workarounds or other approaches you considered.
  - type: textarea
    id: contribution
    attributes:
      label: Contribution / 기여 의사
      description: Let us know if you would like to help implement this change.
