name: Feature request
description: 개선 아이디어와 사용 사례를 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: 사용 사례
      description: 어떤 상황에서 어떤 문제가 발생하나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 원하는 동작이나 인터페이스를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 현재 사용 중인 우회 방법이나 고려한 대안이 있나요?
