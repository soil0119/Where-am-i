name: Bug report
description: 재현 가능한 문제를 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점이나 민감정보는 공개 Issue에 작성하지 말고 SECURITY.md를 확인해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 기대한 동작과 실제 동작을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 최소 단계를 적어 주세요.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 버전
      placeholder: "22.13.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 민감정보를 제거한 로그나 화면 캡처가 있다면 첨부해 주세요.
