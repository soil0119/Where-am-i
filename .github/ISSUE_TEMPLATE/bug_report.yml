name: Bug report
description: Report a reproducible problem. 재현 가능한 문제를 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Where am I. English and Korean reports are both welcome.
        보안 취약점이나 민감정보는 공개 Issue에 작성하지 말고 SECURITY.md를 확인해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior / 기대한 동작과 실제 동작
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps / 재현 방법
      description: Provide the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version / Node.js 버전
      placeholder: "22.13.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system / 운영체제
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 추가 정보
      description: Add sanitized logs, screenshots, or a minimal reproduction repository if available.
